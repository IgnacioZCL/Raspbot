services:
  raspbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raspbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Optional: mount cookies if YouTube requires them. Never commit this file.
      # - ./yt-cookies.txt:/app/yt-cookies.txt:ro
    environment:
      - NODE_ENV=production
